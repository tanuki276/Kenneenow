plugins { id 'com.android.application' }
android {
  namespace 'com.tanuki276.kenneenow'
  compileSdk 35
  defaultConfig {
    applicationId 'com.tanuki276.kenneenow'
    minSdk 29
    targetSdk 35
    versionCode 3
    versionName '1.3.0'
  }
  buildTypes { release { minifyEnabled false } }
  androidResources { noCompress += ['glb', 'gltf', 'bin'] }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
